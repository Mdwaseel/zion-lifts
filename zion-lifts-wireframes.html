<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zion Lifts — Site Wireframes</title>
<style>
:root{
  --ink:#14181B; --line:#14181B; --line-soft:#B9BEC2; --grid:#DADFE2;
  --fill:#EDEFF0; --fill-2:#DEE2E4; --fill-3:#C7CDD0; --fill-dark:#14181B;
  --bg:#F7F8F8; --paper:#FFFFFF; --muted:#7A8186; --accent:#0F7A72;
}
*{box-sizing:border-box}
body{margin:0;font-family:'Segoe UI',Helvetica,Arial,sans-serif;background:#DADFE2;color:var(--ink);-webkit-font-smoothing:antialiased}

/* ---------- top chrome ---------- */
.chrome{position:sticky;top:0;z-index:60;background:var(--fill-dark)}
.chrome__title{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 22px;border-bottom:1px solid rgba(255,255,255,.08);
}
.chrome__title .name{color:#fff;font-size:13px;font-weight:700;letter-spacing:1.5px}
.chrome__title .name span{color:var(--accent)}
.chrome__title .meta{color:#8b9297;font-size:11px;letter-spacing:.5px}
.tabs{display:flex;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{
  flex:0 0 auto;padding:13px 18px;background:none;border:none;color:#9096a0;font-size:12px;
  font-family:inherit;font-weight:600;cursor:pointer;border-right:1px solid rgba(255,255,255,.06);
  white-space:nowrap;letter-spacing:.2px;transition:.15s;
}
.tabs button:hover{color:#fff;background:rgba(255,255,255,.04)}
.tabs button.active{background:var(--bg);color:var(--ink)}

/* ---------- page canvas ---------- */
.page{display:none;max-width:1140px;margin:0 auto;padding:36px 26px 120px}
.page.active{display:block}
.page-eyebrow{font-size:10.5px;letter-spacing:2px;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:6px}
.page-title{font-size:24px;font-weight:800;letter-spacing:-.4px;margin-bottom:6px}
.page-sub{font-size:12.5px;color:var(--muted);margin-bottom:30px;padding-bottom:22px;border-bottom:1.5px solid var(--ink)}

/* ---------- wireframe block ---------- */
.wf{
  background:var(--paper);border:1.5px solid var(--line);position:relative;margin-bottom:16px;
  padding:22px 18px 18px;
}
.wf-num{
  position:absolute;top:-13px;left:14px;background:var(--ink);color:#fff;
  font-size:10px;font-weight:700;letter-spacing:1px;padding:3px 9px;
}
.wf-label{
  font-size:10px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);
  margin-bottom:12px;padding-left:2px;
}
.wf.dark{background:var(--fill-dark);color:#e7e9ea}
.wf.dark .wf-num{background:var(--accent)}
.wf.dark .wf-label{color:#8b9297}
.wf.tint{background:#EAF3F1}

.box{
  background:var(--fill);border:1px solid var(--line-soft);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:4px;color:var(--muted);font-size:11.5px;
  text-align:center;padding:10px;min-height:64px;
}
.box b{color:var(--ink);font-size:12px;font-weight:700}
.wf.dark .box{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.15);color:#9aa0a5}
.wf.dark .box b{color:#fff}
.box.tall{min-height:130px}
.box.xtall{min-height:220px}

.sub-list{list-style:none;margin:0;padding:0;font-size:11px;color:var(--muted)}
.sub-list li{padding:3px 0 3px 14px;position:relative}
.sub-list li::before{content:'—';position:absolute;left:0;color:var(--line-soft)}
.wf.dark .sub-list{color:#9aa0a5}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.grid6{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.grid7{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:840px){.grid3,.grid4,.grid5,.grid6,.grid7{grid-template-columns:1fr 1fr}}

.btn-ph{display:inline-block;border:1.5px solid currentColor;padding:6px 16px;font-size:10.5px;font-weight:700;letter-spacing:.5px}
.nav-wf{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.nav-wf .logo{font-weight:800;font-size:12.5px;letter-spacing:.5px}
.nav-wf .links{display:flex;gap:14px;font-size:10.5px;color:var(--muted)}

.section-index{
  display:flex;flex-wrap:wrap;gap:6px;margin-bottom:24px;
}
.section-index a{
  font-size:10.5px;font-weight:700;background:var(--paper);border:1px solid var(--line-soft);
  padding:5px 10px;color:var(--muted);text-decoration:none;
}
.section-index a:hover{border-color:var(--ink);color:var(--ink)}

.art-brief{
  background:#14181B;color:#e7e9ea;border:1.5px solid var(--line);padding:18px 20px;margin-bottom:22px;
}
.art-brief .wf-num{position:absolute;top:-13px;left:14px;background:var(--accent);color:#fff;font-size:10px;font-weight:700;letter-spacing:1px;padding:3px 9px}
.art-brief{position:relative}
.art-brief h4{margin:0 0 10px;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:#fff}
.art-brief .swatches{display:flex;gap:8px;margin-bottom:12px}
.art-brief .sw{width:56px;height:32px;display:flex;align-items:flex-end;justify-content:center;font-size:8.5px;color:#fff;padding-bottom:3px;font-weight:700}
.art-brief p{font-size:11.5px;color:#b8bcbf;margin:0 0 6px;line-height:1.6}
.art-brief b{color:#fff}

.note{
  margin-top:12px;border:1px dashed #C79A3A;background:rgba(199,154,58,.08);padding:10px 12px;
}
.wf.dark .note{background:rgba(199,154,58,.12)}
.note .note-tag{font-size:9.5px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:#8A6420;margin-bottom:5px}
.wf.dark .note .note-tag{color:#E0B34F}
.note p{font-size:11px;line-height:1.55;color:#5a4a20;margin:0}
.wf.dark .note p{color:#d8c48a}
.note b{font-weight:800}
</style>
</head>
<body>

<div class="chrome">
  <div class="chrome__title">
    <div class="name">ZION LIFTS <span>/</span> SITE WIREFRAMES</div>
    <div class="meta">Low fidelity · structure only</div>
  </div>
  <div class="tabs" id="tabs"></div>
</div>
<div id="pages"></div>

<script>
function idx(items){
  return `<div class="section-index">${items.map((t,i)=>`<a href="#s${i+1}">${String(i+1).padStart(2,'0')} ${t}</a>`).join('')}</div>`;
}
function note(tag, text){
  return `<div class="note"><div class="note-tag">For the designer — ${tag}</div><p>${text}</p></div>`;
}
function nav(breadcrumb){
  return `<div class="wf"><div class="wf-num">NAV</div>
    <div class="nav-wf"><div class="logo">ZION LIFTS</div><div class="links">${breadcrumb}</div><div class="btn-ph">Get a Quote</div></div>
  </div>`;
}
function footer(){
  return `<div class="wf dark"><div class="wf-num">FOOTER</div>
    <div class="wf-label">Closing CTA · 4-col link grid (Brand / Explore / Reach us / Visit) · Baseline + legal</div>
    <div class="grid4">
      <div class="box"><b>Brand</b>logo + tagline</div>
      <div class="box"><b>Explore</b>lifts, about, gallery, faq</div>
      <div class="box"><b>Reach us</b>phone, whatsapp, email</div>
      <div class="box"><b>Visit</b>address, hours</div>
    </div>
  </div>`;
}

const pages = [

/* ============================================================ HOME — "THE ART OF MOVEMENT" ============================================================ */
{id:'home', label:'01 · Home', title:'Home — the art of movement', sub:'/ — the site behaves like a lift: scroll = ascent. 18 sections, 00–17.',
sections:['Preloader','Hero: the elevator','The world below','The Zion collection','Enter the machine','The engineering','The cabin','Build your Zion','Blueprint → reality','The safety lab','The making of Zion','The projects','The details','After the installation','The people','Trust','Final ascent','Final CTA'],
html:(sec)=>`
${nav('Home')}

<div class="art-brief"><div class="wf-num">ART DIRECTION</div>
  <h4>Overall visual language</h4>
  <div class="swatches">
    <div class="sw" style="background:#0B0B0B">Obsidian</div>
    <div class="sw" style="background:#F3F1EC;color:#0B0B0B">Warm white</div>
    <div class="sw" style="background:#8B8B86">Metallic grey</div>
    <div class="sw" style="background:#C7C2B8;color:#0B0B0B">Stone</div>
    <div class="sw" style="background:#048D8E">Zion teal — accent</div>
  </div>
  <p><b>Base:</b> obsidian / warm white / metallic grey / stone — cinematic, architectural, restrained. <b>Accent:</b> the existing Zion teal (#048D8E) used sparingly — floor ticker, one CTA, safety-pass states — never as a section background. This keeps the brand's established colour but lets the site read as engineering-editorial rather than corporate-SaaS.</p>
  <p><b>Three asset systems, used deliberately, never mixed within one section:</b> <b>Image sequence</b> (hero, ascent, machine exploded view, blueprint, safety lab, final ascent) — CGI or AI-generated, scroll-scrubbed via canvas. <b>Video</b> (factory, real installations, real projects, people) — must be real footage, never faked. <b>Static photography</b> (details, service, trust) — breathing sections, minimal motion.</p>
  <p><b>Typography:</b> restrained Swiss/editorial — large sparse statements (SplitText-worthy lines only), not animated on every heading. <b>Navigation:</b> minimal — logo left, menu right, "Get a Quote" right; opening the menu should feel like doors separating, not a dropdown.</p>
</div>

${idx(sec)}

<div class="wf dark" id="s1"><div class="wf-num">00 · PRELOADER</div>
  <div class="wf-label">Near-black · architectural grid · vertical line · wordmark · floor indicator ticking up, then transition into Hero</div>
  <div class="box tall">ZION LIFTS / VERTICAL TRANSPORTATION / HYDERABAD, INDIA — line accelerates upward, no spinner</div>
  ${note('logo lockup + grid motif', 'Not photography — a motion/code asset. Deliver the exact typographic lockup (three lines, tracked out) and the thin vertical-line + grid motif as vector, so the developer can animate it 1:1 rather than approximating.')}
</div>

<div class="wf dark" id="s2"><div class="wf-num">01 · HERO — THE ELEVATOR</div>
  <div class="wf-label">Full viewport, doors closed → scroll = doors open → lobby disappears → building descends/ascends → city appears → skyline → penthouse</div>
  <div class="box xtall">"ZION / ENGINEERED / TO RISE." · lede · "Scroll to ascend" · floor ticker · scroll drives image-sequence frame, not a video</div>
  ${note('image sequence, 180–240 frames', 'Cabin-interior POV, CGI or AI-generated. Deliver as WebP frame folder (frame_0001…frame_0240) plus 3 hero stills for poster/fallback. Mood: cinematic, low-key, warm metal tones. This is the single most important asset on the site — budget accordingly.')}
</div>

<div class="wf" id="s3"><div class="wf-num">02 · THE WORLD BELOW</div>
  <div class="wf-label">Doors open on an architectural space · "Every building has a different rhythm." · horizontal pinned sequence: environment morphs around the elevator</div>
  <div class="grid6"><div class="box">Villa</div><div class="box">Apartment</div><div class="box">Hotel</div><div class="box">Office</div><div class="box">Hospital</div><div class="box">Industrial</div></div>
  ${note('6 environment renders/photos', 'One per building type, identical camera framing (doorway/entrance shot) so they can crossfade or morph cleanly. Architectural photography or matched CGI, natural light, warm minimal palette — these need to look like the same lens, same eye-level, across all six.')}
</div>

<div class="wf dark" id="s4"><div class="wf-num">03 · THE ZION COLLECTION</div>
  <div class="wf-label">"One system. Many possibilities." · one cabin, scroll morphs it through the range · spec appears per stage</div>
  <div class="grid7"><div class="box">Home</div><div class="box">Hydraulic</div><div class="box">MRL</div><div class="box">Panoramic</div><div class="box">Commercial</div><div class="box">Freight</div><div class="box">Platform</div></div>
  ${note('7 cabin renders + 6 transition sequences', 'Same cabin shell, materials/walls/ceiling/doors change per type (e.g. walls become glass for Panoramic). Deliver 7 end-state renders plus ~20–30 transition frames between each consecutive pair — this replaces the old flat 7-card grid entirely.')}
</div>

<div class="wf" id="s5"><div class="wf-num">04 · ENTER THE MACHINE</div>
  <div class="wf-label">Cabin turns transparent · scroll reveals shaft, counterweight, rails, drive, safety system, controller, doors and cabin separating — exploded view with technical labels</div>
  <div class="grid5"><div class="box">01 Traction system</div><div class="box">02 Guide rails</div><div class="box">03 Safety gear</div><div class="box">04 Control system</div><div class="box">05 Door operator</div></div>
  ${note('3D exploded-view model (glTF)', 'Full elevator shaft cutaway as a real 3D asset, not a flat render — this is a signature interaction and should be Three.js-driven. Restrained technical/x-ray aesthetic, no card UI around the labels, just fine typographic callouts.')}
</div>

<div class="wf dark" id="s6"><div class="wf-num">05 · THE ENGINEERING</div>
  <div class="wf-label">Cinematic macro film — motor, bearings, cables, door mechanism, control board, sensors · editorial captions: PRECISION / SILENCE / SAFETY / PERFORMANCE</div>
  <div class="box tall">Camera changes on every scroll tick — Apple product film × Rolls-Royce engineering</div>
  ${note('real macro photography/video of actual components', 'Not stock, not CGI — shoot Zion\'s real motor, drive, sensors. Shallow depth of field, single dramatic light source. This section is what separates "design brand" from "real engineering company" — do not fake it.')}
</div>

<div class="wf" id="s7"><div class="wf-num">06 · THE CABIN</div>
  <div class="wf-label">Fills the screen · slow scroll rotates the camera through ceiling, lighting, walls, flooring, handrails, control panel, doors, finishes</div>
  <div class="box xtall">"Designed around your architecture."</div>
  ${note('360°/rotational sequence of a flagship cabin', 'CGI render or real photography of the premium cabin interior (wood/stone/glass finish). Warm ambient lighting, luxury-interior photography standard — this is the "slow breathing" chapter, so pacing matters more than density.')}
</div>

<div class="wf dark" id="s8"><div class="wf-num">07 · BUILD YOUR ZION</div>
  <div class="wf-label">Interactive cabin configurator — 3D cabin centre, side panel: Material / Floor / Light / Door / Control · each change transitions 15–30 frames, not an instant swap</div>
  <div class="grid2"><div class="box xtall">3D / high-res cabin</div><div class="box xtall">Material · Floor · Light · Door · Control panels + [Save configuration] [Request this design]</div></div>
  ${note('material swatch set + per-swap transition frames', 'Deliver texture/material files for 4 wood, 3 floor, 3 light, 3 door, 3 control options (~16 total), plus a short transition frame set for each swap so changes animate rather than jump-cut. This section is the lead-gen engine — treat it as the most expensive-looking UI on the site.')}
</div>

<div class="wf" id="s9"><div class="wf-num">08 · BLUEPRINT → REALITY</div>
  <div class="wf-label">White blueprint lines on black draw the shaft, measurements, cabin, rails, doors, mechanical system → blueprint becomes 3D model → model becomes photorealistic render → render becomes an actual Zion project photo</div>
  <div class="grid4"><div class="box">Blueprint</div><div class="box">3D model</div><div class="box">Photoreal render</div><div class="box">Real project</div></div>
  ${note('4-stage matched sequence, same product', 'Vector blueprint art → 3D wireframe render → photorealistic CGI render → a real photograph of that same installed lift. All four must clearly be "the same design" — this is the moment that proves Zion actually builds what it renders.')}
</div>

<div class="wf dark" id="s10"><div class="wf-num">09 · THE SAFETY LAB</div>
  <div class="wf-label">Black, industrial, technical · 5 tests: Overload / Power failure / Emergency braking / Fire mode / Seismic · freezes on "SAFETY ISN'T AN OPTION."</div>
  <div class="grid5"><div class="box">Overload</div><div class="box">Power failure</div><div class="box">E-braking</div><div class="box">Fire mode</div><div class="box">Seismic</div></div>
  ${note('5 short sequences or loops, one per test', 'Cabin under each test condition — weight increasing, blackout + emergency lighting, brake engaging, fire-mode UI, structure shaking. High-contrast industrial look; red/amber only where the test genuinely calls for an alert state.')}
</div>

<div class="wf" id="s11"><div class="wf-num">10 · THE MAKING OF ZION</div>
  <div class="wf-label">Documentary sequence — factory, material, machining, welding, assembly, testing, transport, installation, technicians, finished cabin · "From raw material to vertical movement."</div>
  <div class="box tall">Real photography/video, factory floor to finished product</div>
  ${note('real factory shoot — non-negotiable', 'This must be actual Zion footage, not stock or CGI. Documentary style, natural light, authentic — welding, machining, assembly line, technicians at work, cabins ready for dispatch. Schedule a proper shoot day at the facility.')}
</div>

<div class="wf dark" id="s12"><div class="wf-num">11 · THE PROJECTS</div>
  <div class="wf-label">Cinematic case studies, one project fills the screen at a time · scroll: exterior → lobby → lift entrance → cabin → detail → finished project → sideways into next category</div>
  <div class="grid5"><div class="box">Residential</div><div class="box">Commercial</div><div class="box">Hospitality</div><div class="box">Institutional</div><div class="box">Industrial</div></div>
  ${note('5–6 shots per project, real installs', 'Real photography/video across all five categories — exterior, lobby, entrance, cabin, detail, finished shot. Project info (location, lift type, capacity, floors, scope) stays secondary in layout — the imagery is the hero, not a card.')}
</div>

<div class="wf" id="s13"><div class="wf-num">12 · THE DETAILS</div>
  <div class="wf-label">Slow, luxurious macro sequence — door, button, metal, glass, lighting, floor, handrail, ceiling · "Details make the difference."</div>
  <div class="grid4"><div class="box">Door</div><div class="box">Button</div><div class="box">Metal</div><div class="box">Glass</div></div>
  ${note('8 macro photographs', 'Door, button, metal texture, glass, lighting fixture, flooring, handrail, ceiling — extreme close-up, shallow depth of field, tactile. No heavy animation here, the photography carries the section.')}
</div>

<div class="wf tint" id="s14"><div class="wf-num">13 · AFTER THE INSTALLATION</div>
  <div class="wf-label">Slows down · large photo of an operating Zion lift · "Our work doesn't end when the doors open." · 24/7 Service, AMC, Breakdown Support, Modernisation, Remote Monitoring</div>
  <div class="grid5"><div class="box">24/7 service</div><div class="box">AMC</div><div class="box">Breakdown support</div><div class="box">Modernisation</div><div class="box">Remote monitoring</div></div>
  ${note('one large lifestyle photo + 5 small pillar icons', 'A lift genuinely in daily use — people, doors mid-motion, not staged. This is the deliberate tonal shift from technical to human/reassuring. Icons for the 5 service pillars can be simple line marks, not illustrations.')}
</div>

<div class="wf dark" id="s15"><div class="wf-num">14 · THE PEOPLE</div>
  <div class="wf-label">Real engineers, technicians, installation teams, designers, site engineers, manufacturing · close-ups of hands working · "Engineered by people. Built for people."</div>
  <div class="grid4"><div class="box">Portrait</div><div class="box">Portrait</div><div class="box">Hands at work</div><div class="box">Portrait</div></div>
  ${note('real portrait + documentary photography of the team', '6–10 actual team members across roles, plus 3–4 close-ups of hands at work. Candid/documentary, not posed corporate headshots — this is what keeps the site from feeling cold after nine technical sections.')}
</div>

<div class="wf" id="s16"><div class="wf-num">15 · TRUST</div>
  <div class="wf-label">Architectural background image · client logos integrated into the composition (not a logo wall) · certifications · "Trusted by buildings that move people."</div>
  <div class="box">Logos woven into one architectural image, then certification badges</div>
  ${note('architectural background photo + logo/badge files', 'One strong background image, client logo files as monochrome vector (so they can be tinted to sit quietly in the composition), plus ISO/certification badge artwork. Deliberately minimal — resist the urge to grid the logos.')}
</div>

<div class="wf dark" id="s17"><div class="wf-num">16 · FINAL ASCENT</div>
  <div class="wf-label">Loops back to the hero cabin · doors close · floor indicator climbs 12→36 · city drops away · penthouse · doors open onto skyline · "Where should we take you?"</div>
  <div class="box xtall">Same elevator asset as section 01, continued upward, ending on a wide skyline plate</div>
  ${note('extension of the Hero sequence + skyline plate', 'Reuse the section-01 cabin asset and extend it 60–90 more frames to a penthouse-level reveal, plus one wide skyline backdrop for the final doors-open moment. Keeping it the same cabin (not a new render) is what makes the loop land.')}
</div>

<div class="wf dark" id="s18"><div class="wf-num">17 · FINAL CTA</div>
  <div class="wf-label">"Where should we take you?" — [Get a Quote] [Arrange a visit] · Zion wordmark</div>
  <div class="box tall">Closing statement + dual CTA, same restraint as the preloader</div>
</div>

${footer()}
`},

{id:'lifts', label:'02 · Lifts index', title:'Lifts index', sub:'/lifts — 12 sections',

const tabsEl = document.getElementById('tabs');
const pagesEl = document.getElementById('pages');

pages.forEach(p=>{
  const btn = document.createElement('button');
  btn.textContent = p.label;
  btn.dataset.id = p.id;
  btn.onclick = ()=> show(p.id);
  tabsEl.appendChild(btn);

  const sec = document.createElement('div');
  sec.className = 'page';
  sec.id = 'page-'+p.id;
  sec.innerHTML = `<div class="page-eyebrow">Wireframe — low fidelity, structure only</div>
    <div class="page-title">${p.title}</div>
    <div class="page-sub">${p.sub}</div>
    ${p.html(p.sections)}`;
  pagesEl.appendChild(sec);
});

function show(id){
  document.querySelectorAll('.page').forEach(el=>el.classList.toggle('active', el.id==='page-'+id));
  document.querySelectorAll('.tabs button').forEach(el=>el.classList.toggle('active', el.dataset.id===id));
  window.scrollTo(0,0);
}
show('home');
</script>
