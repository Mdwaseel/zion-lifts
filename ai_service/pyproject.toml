[project]
name = "ai-service"
version = "1.0.0"
description = "RAG question-answering service over your own documents."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
markers = [
    "integration: requires a running Qdrant and configured LLM keys",
    "evaluation: slow quality benchmarks",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = [
    "B008",   # FastAPI Depends() in defaults is the documented idiom
    "SIM905", # a split string reads better than a 40-item list literal
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
ignore_missing_imports = true
